<style>
/* Layout: phone-first app shell. Sticky top bar, one scrolling column of cards, fixed bottom tab bar with five sections. */
:root {

  --r: 14px; --nav-h: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1517; --surface: #122023; --sunk: #0e1a1d; --ink: #e4eeef; --muted: #93a9ad; --line: #24393d;
  --accent: #ff6f83; --accent-soft: #3a1b22; --on-accent: #1a0a0e;
  --good: #4cc490; --good-soft: #12302a; --warn: #e3ab4f; --warn-soft: #33270f; --bad: #ff6f83; --bad-soft: #3a1b22;
  --dia: #6fb6d8; --dot: #2b4044; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1517; --surface: #122023; --sunk: #0e1a1d; --ink: #e4eeef; --muted: #93a9ad; --line: #24393d;
  --accent: #ff6f83; --accent-soft: #3a1b22; --on-accent: #1a0a0e;
  --good: #4cc490; --good-soft: #12302a; --warn: #e3ab4f; --warn-soft: #33270f; --bad: #ff6f83; --bad-soft: #3a1b22;
  --dia: #6fb6d8; --dot: #2b4044; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);

.bar-in { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 1.05rem; min-width: 0; }

.who { margin-inline-start: auto;  flex: none; border: 1px solid var(--line); background: var(--sunk); border-radius: 999px; padding: 5px 12px 5px 6px; display: flex; align-items: center; gap: 6px; font-size: .88rem; font-weight: 600; cursor: pointer; max-width: 9rem; }
.who b { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: .78rem; flex: none; }
.who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.wrap { max-width: 640px; margin: 0 auto; padding-block: 18px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom, 0px));

.tabs-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }
.tabs button { border: 0; background: none; display: grid; justify-items: center; align-content: center; gap: 3px; font-size: .7rem; color: var(--muted); cursor: pointer; padding: 0 2px; min-width: 0; }

.tabs button[aria-current="page"] { color: var(--accent); font-weight: 700; }

h1.hello { font-family: var(--display); font-weight: 800; font-size: clamp(1.6rem, 6vw, 2.1rem); letter-spacing: -0.02em; line-height: 1.1; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; }

.big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }

.field { display: grid; gap: 4px; font-size: .88rem; color: var(--muted); min-width: 0; }
.field input, select.full { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--sunk); font-size: 1rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.checks { display: flex; flex-wrap: wrap; gap: 8px; }

.checks input { accent-color: var(--accent); width: 18px; height: 18px; }

.rail li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.nav { display: flex; gap: 10px; }
.nav .primary { flex: 1; }

.list { display: grid; }

.x { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 6px; border-radius: 8px; }

.person:last-child { border-bottom: 0; }

.sos { flex: none; border: 0; background: var(--bad); color: var(--on-accent); font-weight: 800; letter-spacing: .06em; border-radius: 999px; padding: 6px 12px; font-size: .82rem; cursor: pointer; }
.emnum { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.emnum a, .emnum b { font-family: var(--display); font-weight: 800; font-size: clamp(2.6rem, 13vw, 3.4rem); line-height: 1; color: var(--bad); text-decoration: none; letter-spacing: -0.02em; }
.emnum small { color: var(--muted); }
.links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.links a { display: flex; align-items: center; gap: 8px; padding: 12px; border-radius: 12px; background: var(--sunk); color: var(--ink); text-decoration: none; font-weight: 600; font-size: .92rem; border: 1.5px solid transparent; }
.links a:hover { border-color: var(--line); }

.bg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

[dir="rtl"] .tl .ev { padding: 0 18px 14px 0; }
.tl .ev::before { content: ""; position: absolute; inset-inline-start: -7px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); }

textarea.full { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--sunk); font: inherit; color: var(--ink); min-height: 70px; resize: vertical; }
a.btn { text-decoration: none; display: inline-block; color: var(--ink); }
a.btn.primary { color: var(--on-accent); }
a.btn.wa { background: #1fa855; color: #fff; }
.chips2 { display: flex; flex-wrap: wrap; gap: 6px; }
.chips2 button { border: 1.5px solid var(--line); background: var(--sunk); border-radius: 999px; padding: 6px 12px; font-size: .85rem; cursor: pointer; }
.bubble { border-radius: 14px; padding: 10px 14px; max-width: 92%; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .95rem; }
.bubble.me { background: var(--accent-soft); justify-self: end; }

.chat { display: grid; gap: 8px; }
.askrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; }

.stars { display: flex; gap: 6px; }
.stars button { border: 0; background: none; font-size: 1.8rem; line-height: 1; cursor: pointer; color: var(--line); padding: 0 2px; }
.stars button.on { color: var(--warn); }
.lock { min-height: 60vh; display: grid; place-items: center; }
.lock .card { width: min(100%, 360px); text-align: center; justify-items: center; }
.lock input { text-align: center; font-size: 1.6rem; letter-spacing: .4em; width: 100%; padding: 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--sunk); color: var(--ink); }
#qr { background: #fff; padding: 14px; border-radius: 12px; justify-self: center; line-height: 0; }
#qr img, #qr canvas { width: min(70vw, 260px) !important; height: auto !important; image-rendering: pixelated; }
.creator { display: flex; gap: 12px; align-items: center; }
.creator b { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-family: var(--display); flex: none; }
/* risk result (from v1) */
.verdict { display: grid; gap: 14px; }

.bigr .n { font-family: var(--display); font-weight: 800; font-size: clamp(3.2rem, 15vw, 4.4rem); line-height: .9; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }

.facts { display: flex; flex-wrap: wrap; gap: 8px; }

.drv { display: grid; gap: 8px; }

.drv .lab { overflow-wrap: anywhere; unicode-bidi: plaintext; }
.drv .tr { position: relative; height: 14px; }
.drv .tr::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line); }
.drv .b { position: absolute; top: 0; height: 14px; border-radius: 4px; }

.drv .b.dn { background: var(--good); right: 50%; }
.legend2 { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); }
.wi { width: 100%; border-collapse: collapse; font-size: .92rem; font-variant-numeric: tabular-nums; }
.wi td { padding: 9px 0; border-bottom: 1px solid var(--line); }
.wi td + td { text-align: end; white-space: nowrap; padding-inline-start: 10px; }
.wi tr:last-child td { border-bottom: 0; font-weight: 700; }
.wi .d { color: var(--good); font-weight: 700; }
.steps { margin: 0; padding-inline-start: 1.2rem; display: grid; gap: 8px; }

.toast { position: fixed; z-index: 8; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 14px; display: flex; gap: 14px; align-items: center; font-size: .92rem; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.18); }
.toast button { background: none; border: 0; color: var(--accent); font-weight: 700; cursor: pointer; }
.disc { color: var(--muted); font-size: .8rem; text-align: center; margin: 0; }
@media (max-width: 440px) { .brand span { display: none; } }
@media (max-width: 380px) { .stats { grid-template-columns: 1fr 1fr; } .grid3 { grid-template-columns: 1fr 1fr; } .drv .r { grid-template-columns: minmax(0, 7rem) 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

<script>

const M = JSON.parse(document.getElementById("model").textContent);
const AGES = ["18–24","25–29","30–34","35–39","40–44","45–49","50–54","55–59","60–64","65–69","70–74","75–79","80+"];
const DAY = 864e5, SLOT_H = [8, 13, 18, 22], LS = "hrc2";
const ICONS = {
  today: '<path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',

  risk: '<path d="M12 20s-7-4.4-7-9.6A3.8 3.8 0 0 1 12 8a3.8 3.8 0 0 1 7 2.4C19 15.6 12 20 12 20z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
  care: '<path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.6"/>',
  meds: '<rect x="3.5" y="9" width="17" height="7" rx="3.5" transform="rotate(-35 12 12.5)" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m10.2 8.7 3.9 5.6" stroke="currentColor" stroke-width="1.8"/>',
  me: '<circle cx="12" cy="8.5" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'
};
const TABS = ["today", "bp", "risk", "care", "me"];
const VERSION = "5.0", APP_URL = "https://ajinkyarodge66.github.io/heart-risk-check/web/", REPO_URL = "https://github.com/Ajinkyarodge66/heart-risk-check";

// ---------- helpers ----------
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (s, o) => String(s).replace(/\{(\w+)\}/g, (_, k) => o[k]);
const uid = () => Math.random().toString(36).slice(2, 9);
const dkey = d => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`; };
const startOfDay = t => { const x = new Date(t); x.setHours(0, 0, 0, 0); return x.getTime(); };
let lang = (() => { try { const s = JSON.parse(localStorage.getItem("hrc_lang")); if (s && I18N[s]) return s; } catch (e) {} const n = (navigator.language || "en").slice(0, 2); return I18N[n] ? n : "en"; })();
const T1 = () => I18N[lang];
const t = k => { const a = I18N2[lang]; return a[k] !== undefined ? a[k] : I18N2.en[k]; };
const dfmt = (ts, o) => { try { return new Intl.DateTimeFormat(lang, o).format(ts); } catch (e) { return new Date(ts).toLocaleDateString(); } };
const nfmt = (v, d) => { try { return new Intl.NumberFormat(lang, { maximumFractionDigits: d || 0 }).format(v); } catch (e) { return String(v); } };
function rel(ts) {
  const days = Math.round((startOfDay(Date.now()) - startOfDay(ts)) / DAY);
  const time = dfmt(ts, { hour: "numeric", minute: "2-digit" });
  try { const r = new Intl.RelativeTimeFormat(lang, { numeric: "auto" }).format(-days, "day"); return days <= 1 ? `${r} ${time}` : r; } catch (e) { return dfmt(ts, { day: "numeric", month: "short" }); }
}

// ---------- storage ----------
const DEFAULT_ANS = { HighBP: 0, HighChol: 0, CholCheck: 1, Stroke: 0, Diabetes: 0, Smoker: 0, PhysActivity: 1, HvyAlcoholConsump: 0, MentHlth: 0, PhysHlth: 0 };
const blankData = () => ({ bp: [], weight: [], act: {}, meds: [], taken: {}, checks: [], answers: Object.assign({}, DEFAULT_ANS) });
function newProfile(name) { return { id: uid(), name: name || "", sex: 0, by: new Date().getFullYear() - 50, heightCm: 170, units: "m" }; }

function makeDemo() {
  let s = 7; const rnd = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
  const now = Date.now(), p = { id: "demo", name: "Ravi", sex: 1, by: new Date().getFullYear() - 59, heightCm: 172, units: "m", demo: true };
  const d = blankData();
  for (let i = 29; i >= 0; i--) {
    if (i > 0 && rnd() < 0.18) continue;
    const day = new Date(startOfDay(now - i * DAY)); day.setHours(7, 30 + Math.floor(rnd() * 40));
    if (day.getTime() > now) day.setTime(now - 60000);
    const k = 29 - i;
    d.bp.push({ t: day.getTime(), sys: Math.round(147 - k * 0.38 + (rnd() - 0.5) * 10), dia: Math.round(93 - k * 0.22 + (rnd() - 0.5) * 6), pulse: Math.round(70 + rnd() * 10) });
  }
  [[28, 83.4], [21, 82.9], [14, 82.1], [7, 81.6], [1, 81.2]].forEach(([i, kg]) => d.weight.push({ t: now - i * DAY, kg }));
  [20, 0, 30, 25, 15, 30].forEach((m, i) => { d.act[dkey(now - (6 - i) * DAY)] = m; });
  d.meds = [{ id: "m1", name: "Amlodipine", dose: "5 mg", slots: [0], since: now - 90 * DAY }, { id: "m2", name: "Atorvastatin", dose: "20 mg", slots: [3], since: now - 90 * DAY }];
  for (let i = 1; i <= 7; i++) { const k = dkey(now - i * DAY); d.taken[k] = { m1_0: i !== 5, m2_3: i !== 3 }; }
  d.taken[dkey(now)] = { m1_0: true };
  p.med = { blood: "B+", allergies: "Penicillin", conditions: "High blood pressure, high cholesterol", contactName: "Priya (daughter)", contactPhone: "", fam: "Father had a heart attack at 61",
    events: [{ id: "e1", date: "2009-05-14", kind: 1, note: "Appendix removed" }, { id: "e2", date: "2018-02-03", kind: 0, note: "High blood pressure diagnosed" }, { id: "e3", date: "2021-11-20", kind: 4, note: "Total cholesterol 6.4 mmol/L (high)" }],
    lastDon: "", donWeeks: 12, dons: [{ id: "d1", date: dkey(now - 400 * DAY), place: "City Blood Bank" }, { id: "d2", date: dkey(now - 290 * DAY), place: "College blood drive" }, { id: "d3", date: dkey(now - 180 * DAY), place: "City Blood Bank" }, { id: "d4", date: dkey(now - 70 * DAY), place: "Red Cross camp" }] };
  d.answers = { HighBP: 1, HighChol: 1, CholCheck: 1, Stroke: 0, Diabetes: 0, Smoker: 1, PhysActivity: 1, HvyAlcoholConsump: 0, MentHlth: 2, PhysHlth: 3 };
  const S0 = { profiles: [p], active: p.id, data: { [p.id]: d } };
  const r = scorePerson(M, valuesFor(p, d, {}, 83.0));
  d.checks.push({ t: now - 21 * DAY, prob: r.prob, score: r.score, pct: r.pct, band: band(r.score), hbp: 1 });
  return S0;
}
let S = (() => { try { if (localStorage.getItem("hrc2enc")) return null; const v = JSON.parse(localStorage.getItem(LS)); if (v && v.profiles && v.profiles.length) return v; } catch (e) {} return null; })();
// ---------- storage, with optional on-device encryption (PBKDF2 + AES-256-GCM) ----------
const ENC = "hrc2enc";
let CK = null, LOCKED = false, encChain = Promise.resolve(), hiddenAt = 0;
const hasLock = () => { try { return !!localStorage.getItem(ENC); } catch (e) { return false; } };
const b64 = u8 => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KDF_ITER = 600000; // OWASP 2023 guidance for PBKDF2-HMAC-SHA256
async function deriveKey(pin, salt, iter) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter || KDF_ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function sealWithCK() {
  const meta = JSON.parse(localStorage.getItem(ENC)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, CK, new TextEncoder().encode(JSON.stringify(S))));
  return { v: 2, salt: meta.salt, iter: meta.iter || 250000, iv: b64(iv), ct: b64(ct) };
}
async function encWrite(salt) {
  if (salt) { const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, CK, new TextEncoder().encode(JSON.stringify(S))));
    localStorage.setItem(ENC, JSON.stringify({ v: 2, salt, iter: KDF_ITER, iv: b64(iv), ct: b64(ct) })); return; }
  localStorage.setItem(ENC, JSON.stringify(await sealWithCK()));
}
async function openSealed(m, pin) {
  const key = await deriveKey(pin, unb64(m.salt), m.iter || 250000);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(m.iv) }, key, unb64(m.ct));
  return { data: JSON.parse(new TextDecoder().decode(pt)), key };
}
// brute-force throttle: after 5 wrong PINs, wait 30 s, doubling each time (max 1 hour)
const FAIL = "hrc_fail";
const failState = () => { try { return JSON.parse(localStorage.getItem(FAIL)) || { n: 0, until: 0 }; } catch (e) { return { n: 0, until: 0 }; } };
function failWait() { const f = failState(); return Math.max(0, Math.ceil((f.until - Date.now()) / 1000)); }
function failNote() { const f = failState(); f.n++; if (f.n >= 5) f.until = Date.now() + Math.min(3600, 30 * Math.pow(2, f.n - 5)) * 1000; try { localStorage.setItem(FAIL, JSON.stringify(f)); } catch (e) {} }
function failReset() { try { localStorage.removeItem(FAIL); } catch (e) {} }
function save() {
  if (!S) return;
  if (hasLock()) { if (CK) encChain = encChain.then(() => encWrite()).catch(() => {}); return; } // never write plain text while locked
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
}
async function enableLock(pin) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  CK = await deriveKey(pin, salt);
  await encWrite(b64(salt));
  try { localStorage.removeItem(LS); } catch (e) {}
}
function disableLock() { try { localStorage.setItem(LS, JSON.stringify(S)); localStorage.removeItem(ENC); } catch (e) {} CK = null; }
async function unlockWith(pin) {
  if (failWait() > 0) throw { wait: failWait() };
  try { const r = await openSealed(JSON.parse(localStorage.getItem(ENC)), pin); S = r.data; CK = r.key; LOCKED = false; failReset(); } // AES-GCM throws on a wrong PIN
  catch (e) { failNote(); throw { wait: failWait() }; }
}
function lockNow() { CK = null; S = null; LOCKED = true; ui = { tab: "today", form: null, flash: null, riskStep: null }; COACH.turns = []; render(); }
document.addEventListener("visibilitychange", () => { if (document.hidden) hiddenAt = Date.now(); else if (CK && hiddenAt && Date.now() - hiddenAt > 5 * 60 * 1000) lockNow(); });
const P = () => S.profiles.find(p => p.id === S.active) || S.profiles[0];
const D = () => { const p = P(); if (!S.data[p.id]) S.data[p.id] = blankData(); return S.data[p.id]; };

// ---------- health maths ----------
function bpCat(s, d) {
  if (s > 180 || d > 120) return "crisis";
  if (s >= 140 || d >= 90) return "s2";
  if (s >= 130 || d >= 80) return "s1";
  if (s >= 120) return "elevated";
  return "normal";
}
function bpAvg(days) {
  const from = Date.now() - days * DAY, r = D().bp.filter(x => x.t >= from);
  if (!r.length) return null;
  return { sys: Math.round(r.reduce((a, x) => a + x.sys, 0) / r.length), dia: Math.round(r.reduce((a, x) => a + x.dia, 0) / r.length), n: r.length,
           inT: Math.round(r.filter(x => x.sys < 130 && x.dia < 80).length / r.length * 100) };
}
const latestWeight = d => (d.weight.length ? d.weight[d.weight.length - 1].kg : null);
function ageBand(by) { const a = new Date().getFullYear() - by; return a < 25 ? 1 : Math.min(13, Math.floor((a - 25) / 5) + 2); }
function bmiOf(cm, kg) { const v = kg / Math.pow(cm / 100, 2); return isFinite(v) ? Math.min(98, Math.max(12, Math.round(v * 10) / 10)) : 25; }
function valuesFor(p, d, over, kg) {
  const a = d.answers, w = kg || latestWeight(d) || 75;
  return Object.assign({ HighBP: a.HighBP, HighChol: a.HighChol, CholCheck: a.CholCheck, BMI: bmiOf(p.heightCm, w), Smoker: a.Smoker, Stroke: a.Stroke,
    Diabetes: a.Diabetes, PhysActivity: a.PhysActivity, HvyAlcoholConsump: a.HvyAlcoholConsump, MentHlth: a.MentHlth, PhysHlth: a.PhysHlth,
    Sex: p.sex, Age: ageBand(p.by) }, over || {});
}
const values = over => valuesFor(P(), D(), over);
// wizard context: the person being checked (own profile, or a screening subject in health-worker mode)
function W() {
  if (ui.subj) return ui.subj;
  const p = P(), d = D();
  return { answers: d.answers, sex: p.sex, age: ageBand(p.by), heightCm: p.heightCm, kg: ui.wkg || latestWeight(d) || 75, personal: true };
}
function wValues(over) {
  const w = W(), a = Object.assign({}, w.answers);
  if (!w.personal && w.bp && a.HighBP === null) { const c = bpCat(w.bp.sys, w.bp.dia); if (c === "s2" || c === "crisis") a.HighBP = 1; else if (c === "normal" || c === "elevated") a.HighBP = 0; }
  return Object.assign({ HighBP: a.HighBP, HighChol: a.HighChol, CholCheck: a.CholCheck, BMI: bmiOf(w.heightCm, w.kg), Smoker: a.Smoker, Stroke: a.Stroke,
    Diabetes: a.Diabetes, PhysActivity: a.PhysActivity, HvyAlcoholConsump: a.HvyAlcoholConsump, MentHlth: a.MentHlth, PhysHlth: a.PhysHlth, Sex: w.sex, Age: w.age }, over || {});
}
const newSubj = () => ({ id: uid(), code: "", place: (S.screen && S.screen.length ? S.screen[S.screen.length - 1].place : "") || "", sex: 0, age: 8, heightCm: 165, kg: 70, bp: null, consent: false, answers: Object.assign({}, DEFAULT_ANS) });
const band = s => (s >= M.threshold ? "high" : s >= 0.5 ? "mod" : "low");
const per100 = p => (p * 100 < 1 ? "<1" : String(Math.round(p * 100)));

// units
const isImp = () => P().units === "i";
const wDisp = kg => (isImp() ? Math.round(kg * 2.20462 * 10) / 10 : Math.round(kg * 10) / 10);
const wUnit = () => (isImp() ? t("lb") : t("kg"));
const toKg = v => (isImp() ? v / 2.20462 : v);

// meds
const slotName = i => t("slots")[i];
function dosesFor(day) {
  const end = startOfDay(day) + DAY, out = [];
  D().meds.forEach(m => { if ((m.since || 0) < end) m.slots.forEach(s => out.push({ m, s, key: `${m.id}_${s}` })); });
  return out.sort((a, b) => a.s - b.s);
}
const isTaken = (day, key) => !!(D().taken[dkey(day)] || {})[key];
function adherence7() {
  let exp = 0, got = 0;
  for (let i = 1; i <= 7; i++) { const day = Date.now() - i * DAY; dosesFor(day).forEach(x => { exp++; if (isTaken(day, x.key)) got++; }); }
  return exp ? Math.round(got / exp * 100) : null;
}
function streak() {
  let n = 0;
  for (let i = 1; i < 365; i++) { const day = Date.now() - i * DAY, ds = dosesFor(day); if (!ds.length || !ds.every(x => isTaken(day, x.key))) break; n++; }
  const today = dosesFor(Date.now());
  if (today.length && today.every(x => isTaken(Date.now(), x.key))) n++;
  return n;
}
function weekMinutes() { let s = 0; for (let i = 0; i < 7; i++) s += D().act[dkey(Date.now() - i * DAY)] || 0; return s; }

// ---------- UI state ----------
let ui = { tab: "today", form: null, flash: null, riskStep: null, toast: null };
let undoBuf = null, toastTimer = null;
function toast(msg, undo) {
  const el = document.getElementById("toast");
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button type="button" data-act="undo">${esc(t("undo"))}</button>` : ""}`;
  el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; undoBuf = null; }, 5000);
}

// ---------- components ----------
function seg(name, opts, cur, cls) {
  return `<div class="seg ${cls || ""}" role="radiogroup">${opts.map(([v, lab]) => {
    const id = `${name}_${v}`;
    return `<input type="radio" id="${id}" name="${name}" value="${v}" ${String(cur) === String(v) ? "checked" : ""}><label for="${id}">${esc(lab)}</label>`;
  }).join("")}</div>`;
}
const qf = (key, legend, opts, hint, warn) => `<fieldset class="q"><legend>${esc(legend)}</legend>${hint ? `<div class="hint ${warn ? "warn" : ""}">${esc(hint)}</div>` : ""}${seg("a_" + key, opts, W().answers[key] === null ? "null" : W().answers[key])}</fieldset>`;
function demoBanner() {
  return P().demo ? `<div class="banner"><span>${esc(t("demo"))}</span><button class="btn primary sm" type="button" data-act="demo-start">${esc(t("demoStart"))}</button></div>` : "";
}
function dosesHTML() {
  const ds = dosesFor(Date.now()), h = new Date().getHours();
  if (!ds.length) return `<p class="muted" style="margin:0">${esc(t("noMeds"))}</p>`;
  return `<div class="doses">${ds.map(x => {
    const done = isTaken(Date.now(), x.key), due = !done && h >= SLOT_H[x.s];
    return `<button type="button" class="dose ${done ? "done" : due ? "due" : ""}" data-act="take" data-key="${x.key}" aria-pressed="${done}">
      <span class="tick">${done ? '<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ""}</span>
      <span class="nm">${esc(x.m.name)}<small>${esc(x.m.dose)} · ${esc(slotName(x.s))}</small></span>
      <span class="st">${done ? "✓" : due ? esc(t("due")) : ""}</span></button>`;
  }).join("")}</div>`;
}
function bpChart() {
  const from = startOfDay(Date.now() - 29 * DAY), to = Date.now(), r = D().bp.filter(x => x.t >= from);
  if (r.length < 2) return "";
  const W = 340, H = 190, L = 34, R = 10, Tp = 12, B = 26;
  const lo = Math.min(60, ...r.map(x => x.dia)) - 5, hi = Math.max(160, ...r.map(x => x.sys)) + 5;
  const X = ts => L + (ts - from) / (to - from) * (W - L - R), Y = v => Tp + (hi - v) / (hi - lo) * (H - Tp - B);
  const line = k => r.map((x, i) => `${i ? "L" : "M"}${X(x.t).toFixed(1)} ${Y(x[k]).toFixed(1)}`).join("");
  const ticks = [80, 120, 160].filter(v => v > lo && v < hi);
  const a = r.length ? { s: Math.round(r.reduce((x, y) => x + y.sys, 0) / r.length), d: Math.round(r.reduce((x, y) => x + y.dia, 0) / r.length) } : null;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("chartT"))}: ${r.length} readings${a ? `, average ${a.s}/${a.d} mmHg` : ""}; ${esc(t("target"))}">
    <rect x="${L}" y="${Y(130)}" width="${W - L - R}" height="${Y(lo) - Y(130)}" fill="var(--good-soft)" opacity=".6"/>
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`).join("")}
    <line x1="${L}" x2="${W - R}" y1="${Y(130)}" y2="${Y(130)}" stroke="var(--good)" stroke-dasharray="4 4"/>
    <line x1="${L}" x2="${W - R}" y1="${Y(80)}" y2="${Y(80)}" stroke="var(--good)" stroke-dasharray="4 4"/>
    <text x="${W - R}" y="${Y(130) - 4}" text-anchor="end" font-size="10" fill="var(--good)">130</text>
    <text x="${W - R}" y="${Y(80) - 4}" text-anchor="end" font-size="10" fill="var(--good)">80</text>
    <path d="${line("sys")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    <path d="${line("dia")}" fill="none" stroke="var(--dia)" stroke-width="2" stroke-linejoin="round"/>
    ${r.map(x => `<circle cx="${X(x.t).toFixed(1)}" cy="${Y(x.sys).toFixed(1)}" r="2.6" fill="var(--accent)"/><circle cx="${X(x.t).toFixed(1)}" cy="${Y(x.dia).toFixed(1)}" r="2.6" fill="var(--dia)"/>`).join("")}
    ${(() => { const x = r[r.length - 1]; return `<circle cx="${X(x.t)}" cy="${Y(x.sys)}" r="4.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/><circle cx="${X(x.t)}" cy="${Y(x.dia)}" r="4.5" fill="var(--surface)" stroke="var(--dia)" stroke-width="2"/>`; })()}
    <text x="${L}" y="${H - 6}" font-size="10" fill="var(--muted)">${esc(dfmt(from, { day: "numeric", month: "short" }))}</text>

}

}

      const a = document.createElement("a"); a.href = `${REPO_URL}/issues/new?title=${encodeURIComponent("Feedback: " + (txt.slice(0, 50) || "Heart Risk Check"))}&body=${encodeURIComponent(body)}`; a.target = "_blank"; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove(); break; }
    case "sos-loc": {
      const done = (pos) => { ui.loc = pos ? { msg: fmt(t("sosLocMsg"), { link: `https://maps.google.com/?q=${pos.coords.latitude.toFixed(5)},${pos.coords.longitude.toFixed(5)}` }) } : { msg: t("sosLocMsgNo"), fail: true }; render(); };
      try { if (!navigator.geolocation) throw 0; el.disabled = true; navigator.geolocation.getCurrentPosition(p => done(p), () => done(null), { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }); } catch (x) { done(null); }
      break; }
    case "don-add": ui.form = "don"; render(); break;
    case "don-del": { const m = med(); m.dons = m.dons.filter(x => x.id !== el.dataset.id); save(); render(); toast(t("deleted")); break; }
    case "mid-edit": ui.form = "mid"; render(); { const x = document.getElementById("m_blood"); if (x) x.scrollIntoView({ block: "center" }); } break;
    case "ev-add": ui.form = "ev"; render(); { const x = document.getElementById("e_date"); if (x) { x.scrollIntoView({ block: "center" }); x.focus(); } } break;
    case "ev-del": { const m = med(); m.events = m.events.filter(x => x.id !== el.dataset.id); save(); render(); toast(t("deleted")); break; }
    case "copy-src": copyText(shareTexts[el.dataset.src] || "", el); break;
    case "share": { const txt = shareTexts[el.dataset.src] || ""; try { if (navigator.share) { navigator.share({ text: txt }).catch(() => copyText(txt, el)); break; } } catch (x) {} copyText(txt, el); break; }
    case "screen-new": ui = { tab: "risk", riskStep: 0, form: null, flash: null, subj: newSubj() }; render(); window.scrollTo({ top: 0 }); break;
    case "screen-list": go("risk"); break;
    case "screen-del": { S.screen = (S.screen || []).filter(x => x.id !== el.dataset.id); save(); render(); toast(t("deleted")); break; }
    case "screen-csv": saveFile(`screening-${dkey(Date.now())}.csv`, screenCSV()); break;
    case "install": if (deferredInstall) { deferredInstall.prompt(); deferredInstall.userChoice.finally(() => { deferredInstall = null; render(); }); } break;
    case "report-copy": copyText(reportText(), el); break;
    case "report-save": saveFile(`heart-report-${(P().name || "me").replace(/[^\w-]+/g, "_")}-${dkey(Date.now())}.txt`, reportText()); break;
    case "export": {
      const name = `heart-risk-check-backup-${dkey(Date.now())}.json`;
      if (hasLock() && CK) sealWithCK().then(enc => saveFile(name, JSON.stringify({ app: "heart-risk-check", v: 3, enc })));
      else saveFile(name, JSON.stringify({ app: "heart-risk-check", v: 2, data: S }, null, 1));
      break; }
  }
});

document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "lang") { lang = el.value; try { localStorage.setItem("hrc_lang", JSON.stringify(lang)); } catch (x) {} render(); return; }
  if (el.classList && el.classList.contains("tri")) { const i = Number(el.dataset.i); ui.tri = (ui.tri || []).filter(x => x !== i); if (el.checked) ui.tri.push(i); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (el.id === "emCountry") { S.country = el.value; save(); render(); return; }
  if (el.id === "myNum") { S.myNum = (el.value || "").replace(/[^\d+*#]/g, "").slice(0, 20); save(); render(); return; }
  if (el.id === "m_last" || el.id === "m_weeks") { const m = med(); if (el.id === "m_last") m.lastDon = el.value; else { const w = parseInt(el.value, 10); if (w >= 4 && w <= 52) m.donWeeks = w; } save(); render(); return; }
  if (el.id === "m_fam") { med().fam = el.value.trim(); save(); return; }
  if (el.id === "bpPhoto" && el.files && el.files[0]) { readPhoto(el.files[0]); return; }
  if (el.id === "obOk") { document.getElementById("obGo").disabled = !el.checked; return; }
  if (el.id === "workerToggle") { S.worker = el.checked; save(); render(); return; }
  if (el.id === "sc_refer") { const rec = (S.screen || []).find(x => ui.subj && x.id === ui.subj.id); if (rec) { rec.referred = el.checked; save(); } return; }
  if (el.id === "sc_consent") { const m = document.getElementById("consentMsg"); if (m && el.checked) m.hidden = true; return; }
  if (el.id === "importFile" && el.files && el.files[0]) {
    const fr = new FileReader();
    fr.onload = () => { try { const j = JSON.parse(fr.result);
      if (j && j.enc && j.enc.ct) { ui.impPending = j.enc; rerenderKeep(); const x = document.getElementById("impPin"); if (x) { x.scrollIntoView({ block: "center" }); x.focus(); } return; }
      const v = j && j.data ? j.data : j; if (!v.profiles || !v.profiles.length || !v.data) throw 0; S = v; save(); go("today"); toast(t("imported")); } catch (x) { toast(t("importErr")); } };
    fr.readAsText(el.files[0]); return;
  }
  if (el.type === "radio") {
    const d = D(), p = P(), val = el.value;
    if (el.name.startsWith("a_")) { W().answers[el.name.slice(2)] = val === "null" ? null : Number(val); save(); }
    else if (el.name === "p_sex") { (ui.subj || p).sex = Number(val); save(); }
    else if (el.name === "pf_sex") { p.sex = Number(val); save(); }
    else if (el.name === "p_units" || el.name === "pf_units") { if (el.name === "p_units") readStep0(); p.units = val; save(); render(); }
  }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "fbText") { ui.fbText = el.value; return; }
  if (/^rq_/.test(el.id)) { const r = S.req = S.req || {}; r[el.id.slice(3)] = el.id === "rq_u" ? (parseInt(el.value, 10) || 1) : el.value.trim(); save(); shareTexts.req = reqMessage();
    document.getElementById("rqOut").textContent = shareTexts.req; const a = document.getElementById("req_wa"); if (a) a.href = waURL(shareTexts.req); return; }
  if (el.type === "range" && el.dataset.key) { W().answers[el.dataset.key] = Number(el.value); document.getElementById("o_" + el.dataset.key).textContent = `${el.value} ${T1().days}`; save(); }
  if (["w_cm", "w_ft", "w_in", "w_w"].includes(el.id)) { readStep0(); const o = document.getElementById("bmiOut"); if (o) { const w = W(); o.textContent = bmiOf(w.heightCm, w.kg).toFixed(1); } }
});
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form]"); if (!f) return; e.preventDefault();
  const d = S ? D() : null, p = S ? P() : null, num = id => parseFloat((document.getElementById(id) || {}).value);
  switch (f.dataset.form) {
    case "bp": {
      const sys = Math.round(num("f_sys")), dia = Math.round(num("f_dia")), pulse = Math.round(num("f_pulse"));
      if (!(sys >= 60 && sys <= 260 && dia >= 30 && dia <= 160 && dia < sys)) { document.getElementById(!(sys >= 60 && sys <= 260) ? "f_sys" : "f_dia").focus(); return; }
      const note = ((document.getElementById("f_note") || {}).value || "").trim();
      d.bp.push({ t: Date.now(), sys, dia, pulse: pulse >= 30 && pulse <= 220 ? pulse : null, src: ui.photoUsed ? "photo" : "manual", note: note || undefined, created: Date.now() }); d.bp.sort((a, b) => a.t - b.t); ui.photoUsed = false;
      save(); ui.form = null; ui.flash = { sys, dia, cat: bpCat(sys, dia) }; render(); window.scrollTo({ top: 0 }); break;
    }
    case "med": {
      const name = (document.getElementById("f_mname").value || "").trim(); if (!name) { document.getElementById("f_mname").focus(); return; }
      const slots = [0, 1, 2, 3].filter(i => document.getElementById("f_slot" + i).checked);
      d.meds.push({ id: uid(), name, dose: (document.getElementById("f_mdose").value || "").trim(), slots: slots.length ? slots : [0], since: startOfDay(Date.now()) });
      save(); ui.form = null; render(); break;
    }
    case "profile": {
      p.name = (document.getElementById("p_name").value || "").trim();
      const by = num("p_by"); if (by >= 1900 && by <= new Date().getFullYear() - 18) p.by = Math.round(by);
      if (isImp()) { const ft = num("p_ft"), inch = num("p_in") || 0; if (ft > 2 && ft < 8) p.heightCm = Math.round((ft * 12 + inch) * 2.54); }
      else { const cm = num("p_cm"); if (cm > 90 && cm < 250) p.heightCm = cm; }
      if (p.demo) delete p.demo;
      save(); render(); toast(t("save") + " ✓"); break;
    }
    case "weight": { const w = num("f_w"); if (!(w > 0)) return; const kg = toKg(w); if (kg < 20 || kg > 350) return; d.weight.push({ t: Date.now(), kg: Math.round(kg * 10) / 10 }); save(); render(); break; }
    case "imppin": { const pin = document.getElementById("impPin").value;
      openSealed(ui.impPending, pin).then(r => { const v = r.data; if (!v.profiles || !v.data) throw 0; S = v; ui.impPending = null; save(); go("today"); toast(t("imported")); })
        .catch(() => { const m = document.getElementById("impMsg"); if (m) { m.textContent = t("wrongPin"); m.hidden = false; } }); break; }
    case "ob": { if (!document.getElementById("obOk").checked) return; S.consents = (S.consents || []).concat([{ purpose: "terms", v: POLICY_V, at: Date.now() }]); save(); render(); window.scrollTo(0, 0); break; }
    case "unlock": { const pin = document.getElementById("lockPin").value; const btn = f.querySelector("button[type=submit]"); btn.disabled = true;
      unlockWith(pin).then(() => { ui.forgot = false; ui.eraseArm = false; render(); }).catch(e => { btn.disabled = false; const er = document.getElementById("lockErr"); if (er) { er.textContent = e && e.wait ? fmt(t("tooMany"), { s: e.wait }) : t("wrongPin"); er.hidden = false; } const pi = document.getElementById("lockPin"); pi.value = ""; pi.focus(); }); break; }
    case "setlock": { const a = document.getElementById("pinA").value, b2 = document.getElementById("pinB").value, msg = document.getElementById("pinMsg");
      if (!/^\d{6,12}$/.test(a)) { msg.textContent = t("pinShort"); msg.hidden = false; return; } if (a !== b2) { msg.textContent = t("pinMismatch"); msg.hidden = false; return; }
      enableLock(a).then(() => { rerenderKeep(); toast(t("lockOn")); }).catch(() => { msg.textContent = "Encryption is not available in this browser."; msg.hidden = false; }); break; }
    case "coach": { const inp = document.getElementById("coachIn"); const q = (inp.value || "").trim(); if (q) coachAsk(q); break; }
    case "don": { const dt = document.getElementById("d_date").value; if (!dt) return; const m = med(); m.dons.push({ id: uid(), date: dt, place: document.getElementById("d_place").value.trim() }); save(); ui.form = null; render(); break; }
    case "mid": { const m = med(); m.blood = document.getElementById("m_blood").value; m.allergies = document.getElementById("m_all").value.trim(); m.conditions = document.getElementById("m_cond").value.trim();
      m.contactName = document.getElementById("m_cn").value.trim(); m.contactPhone = document.getElementById("m_cp").value.trim(); if (S.req && !S.req.h && m.blood) S.req.g = m.blood; save(); ui.form = null; render(); break; }
    case "ev": { const dt = document.getElementById("e_date").value, note = document.getElementById("e_note").value.trim(); if (!dt) { document.getElementById("e_date").focus(); return; } if (!note) { document.getElementById("e_note").focus(); return; }
      const m = med(); m.events = m.events || []; m.events.push({ id: uid(), date: dt, kind: Number(document.getElementById("e_kind").value), note }); save(); ui.form = null; render(); break; }
    case "person": { const name = (document.getElementById("f_pname").value || "").trim(); if (!name) return; const np = newProfile(name); S.profiles.push(np); S.data[np.id] = blankData(); S.active = np.id; save(); go("me"); break; }
  }
});

// ---------- boot ----------
let deferredInstall = null;
(async () => { try { if (window.claude && window.claude.use) { const s = await window.claude.use("sample"); if (s) { AI.sample = s; try { const l = await s.limits(); AI.images = !!(l && l.images); } catch (e) {} if (["today", "bp"].includes(ui.tab)) rerenderKeep(); } } } catch (e) {} })();
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; if (ui.tab === "me") render(); });
try { if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}
if (hasLock()) { S = null; LOCKED = true; } else if (!S) { S = makeDemo(); save(); }
const sel = document.getElementById("lang");
sel.innerHTML = Object.keys(I18N).map(k => `<option value="${k}" ${k === lang ? "selected" : ""}>${I18N[k]._name}</option>`).join("");
const h = (location.hash || "").slice(1); if (TABS.includes(h)) ui.tab = h;
render();
</script>

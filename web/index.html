<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Heart Risk Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A heart-health companion: blood-pressure log, medicine reminders, family profiles and a two-minute heart check. Runs on your phone.">
<meta name="theme-color" content="#c8324b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap">
<style>
/* Layout: phone-first app shell. Sticky top bar, one scrolling column of cards, fixed bottom tab bar with five sections. */
:root {
  --bg: #eef3f2; --surface: #ffffff; --sunk: #e3ebea; --ink: #0f2328; --muted: #566b70; --line: #cfdcdb;
  --accent: #c8324b; --accent-soft: #f6dde2; --on-accent: #ffffff;
  --good: #1d7f57; --good-soft: #d7efe4; --warn: #9a6512; --warn-soft: #f6e8cc; --bad: #c8324b; --bad-soft: #f6dde2;
  --dia: #2f6f8f; --dot: #c9d6d5;
  --display: "Bricolage Grotesque", "Noto Sans", system-ui, sans-serif;
  --body: "Noto Sans", "Noto Sans Devanagari", "Noto Sans Arabic", system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --r: 14px; --nav-h: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1517; --surface: #122023; --sunk: #0e1a1d; --ink: #e4eeef; --muted: #93a9ad; --line: #24393d;
  --accent: #ff6f83; --accent-soft: #3a1b22; --on-accent: #1a0a0e;
  --good: #4cc490; --good-soft: #12302a; --warn: #e3ab4f; --warn-soft: #33270f; --bad: #ff6f83; --bad-soft: #3a1b22;
  --dia: #6fb6d8; --dot: #2b4044; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1517; --surface: #122023; --sunk: #0e1a1d; --ink: #e4eeef; --muted: #93a9ad; --line: #24393d;
  --accent: #ff6f83; --accent-soft: #3a1b22; --on-accent: #1a0a0e;
  --good: #4cc490; --good-soft: #12302a; --warn: #e3ab4f; --warn-soft: #33270f; --bad: #ff6f83; --bad-soft: #3a1b22;
  --dia: #6fb6d8; --dot: #2b4044; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 1.05rem; min-width: 0; }
.brand span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand svg { flex: none; }
.who { margin-inline-start: auto;  flex: none; border: 1px solid var(--line); background: var(--sunk); border-radius: 999px; padding: 5px 12px 5px 6px; display: flex; align-items: center; gap: 6px; font-size: .88rem; font-weight: 600; cursor: pointer; max-width: 9rem; }
.who b { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: .78rem; flex: none; }
.who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lang select { background: var(--sunk); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; font-size: .88rem; max-width: 7.5rem; }

.wrap { max-width: 640px; margin: 0 auto; padding-block: 18px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
.wrap > * { min-width: 0; }

.tabs { position: fixed; inset: auto 0 0 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }
.tabs button { border: 0; background: none; display: grid; justify-items: center; align-content: center; gap: 3px; font-size: .7rem; color: var(--muted); cursor: pointer; padding: 0 2px; min-width: 0; }
.tabs button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabs button[aria-current="page"] { color: var(--accent); font-weight: 700; }
.tabs svg { width: 24px; height: 24px; }

h1.hello { font-family: var(--display); font-weight: 800; font-size: clamp(1.6rem, 6vw, 2.1rem); letter-spacing: -0.02em; line-height: 1.1; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; }
h2 { font-family: var(--display); font-size: 1.12rem; margin: 0; letter-spacing: -0.01em; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 14px; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.banner { background: var(--warn-soft); color: var(--ink); border-radius: var(--r); padding: 12px 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: .92rem; }

.big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.big .v { font-family: var(--display); font-weight: 800; font-size: clamp(2.6rem, 12vw, 3.4rem); line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.big .u { color: var(--muted); font-size: .9rem; }
.chip { display: inline-block; font-size: .75rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.chip.low, .chip.normal { background: var(--good-soft); color: var(--good); }
.chip.mod, .chip.elevated, .chip.s1 { background: var(--warn-soft); color: var(--warn); }
.chip.high, .chip.s2, .chip.crisis { background: var(--bad-soft); color: var(--bad); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--sunk); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.stat small { color: var(--muted); font-size: .76rem; line-height: 1.25; }
.stat b { font-family: var(--display); font-size: 1.2rem; font-variant-numeric: tabular-nums; }

.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; cursor: pointer; text-align: center; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); }
.btn.soft { background: var(--sunk); }
.btn.sm { padding: 7px 12px; font-size: .88rem; border-radius: 10px; }
.btn.full { width: 100%; }
.btn:active { transform: translateY(1px); }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.row-btns .btn { flex: 1 1 8rem; }
.linkbtn { background: none; border: 0; color: var(--accent); font-weight: 700; cursor: pointer; padding: 0; }

.field { display: grid; gap: 4px; font-size: .88rem; color: var(--muted); min-width: 0; }
.field input, select.full { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--sunk); font-size: 1rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.checks label { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--sunk); cursor: pointer; font-size: .92rem; }
.checks input { accent-color: var(--accent); width: 18px; height: 18px; }

.q { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; min-width: 0; }
.q legend, .q > .lbl { font-weight: 600; padding: 0; margin-bottom: 10px; }
.q .hint { color: var(--muted); font-size: .85rem; margin-top: -6px; }
.q .hint.warn { color: var(--warn); font-weight: 600; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { flex: 1 1 0; min-width: 5.5rem; text-align: center; padding: 11px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--sunk); cursor: pointer; font-weight: 500; }
.seg input:checked + label { background: var(--accent-soft); border-color: var(--accent); font-weight: 700; }
.seg input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }
.seg.mini label { min-width: 0; padding: 6px 10px; font-size: .85rem; white-space: nowrap; flex: none; }
.slider { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.slider input { width: 100%; accent-color: var(--accent); height: 28px; }
.slider output { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; min-width: 4.5rem; text-align: end; }
.rail { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; list-style: none; padding: 0; margin: 0; }
.rail li { font-size: .76rem; color: var(--muted); display: grid; gap: 6px; min-width: 0; }
.rail li::before { content: ""; height: 5px; border-radius: 3px; background: var(--line); }
.rail li.done::before, .rail li.on::before { background: var(--accent); }
.rail li.on { color: var(--ink); font-weight: 600; }
.rail li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bmi { display: flex; justify-content: space-between; align-items: baseline; background: var(--sunk); border-radius: 10px; padding: 10px 14px; }
.bmi b { font-family: var(--display); font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.nav { display: flex; gap: 10px; }
.nav .primary { flex: 1; }

.list { display: grid; }
.li { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; }
.li .main { min-width: 0; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.li .val { font-family: var(--display); font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.x { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 6px; border-radius: 8px; }
.x:hover { color: var(--bad); background: var(--bad-soft); }

.dose { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--sunk); border: 1.5px solid transparent; cursor: pointer; text-align: start; width: 100%; }
.dose.due { border-color: var(--warn); background: var(--warn-soft); }
.dose.done { opacity: .75; }
.dose .tick { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; background: var(--surface); }
.dose.done .tick { background: var(--good); border-color: var(--good); color: var(--on-accent); }
.dose .nm { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.dose .nm small { display: block; font-weight: 400; color: var(--muted); }
.dose .st { font-size: .78rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
.dose.due .st { color: var(--warn); }
.dose.done .st { color: var(--good); }
.doses { display: grid; gap: 8px; }

.meter { height: 10px; border-radius: 5px; background: var(--sunk); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--good); border-radius: 5px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 70px; }
.week div { display: grid; gap: 4px; justify-items: center; align-content: end; height: 100%; font-size: .7rem; color: var(--muted); }
.week i { width: 100%; max-width: 26px; border-radius: 5px 5px 2px 2px; background: var(--good); min-height: 3px; }
.week .today { color: var(--ink); font-weight: 700; }
.quick { display: flex; gap: 8px; flex-wrap: wrap; }

.chart { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }

.alarm { background: var(--bad-soft); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 6px; }
.alarm strong { color: var(--bad); }
.alarm p { margin: 0; font-size: .92rem; }
.note { color: var(--muted); font-size: .82rem; margin: 0; }
details { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; }
details summary { cursor: pointer; font-weight: 600; }
details p { color: var(--muted); font-size: .9rem; margin: 10px 0 0; }
pre.report { white-space: pre-wrap; background: var(--sunk); border-radius: 10px; padding: 12px; margin: 0; font-size: .82rem; max-height: 320px; overflow: auto; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.person { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.person:last-child { border-bottom: 0; }
.person b.av { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.person .nm { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sos { flex: none; border: 0; background: var(--bad); color: var(--on-accent); font-weight: 800; letter-spacing: .06em; border-radius: 999px; padding: 6px 12px; font-size: .82rem; cursor: pointer; }
.emnum { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.emnum a, .emnum b { font-family: var(--display); font-weight: 800; font-size: clamp(2.6rem, 13vw, 3.4rem); line-height: 1; color: var(--bad); text-decoration: none; letter-spacing: -0.02em; }
.emnum small { color: var(--muted); }
.links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.links a { display: flex; align-items: center; gap: 8px; padding: 12px; border-radius: 12px; background: var(--sunk); color: var(--ink); text-decoration: none; font-weight: 600; font-size: .92rem; border: 1.5px solid transparent; }
.links a:hover { border-color: var(--line); }
.links a svg { flex: none; color: var(--accent); }
.kv { display: grid; grid-template-columns: minmax(0, 8.5rem) 1fr; gap: 6px 12px; font-size: .92rem; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.bg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.bg span { text-align: center; padding: 8px 0; border-radius: 8px; background: var(--sunk); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
.bg span.ok { background: var(--good-soft); color: var(--good); }
.tl { display: grid; gap: 0; border-inline-start: 2px solid var(--line); margin-inline-start: 6px; }
.tl .ev { position: relative; padding: 0 0 14px 18px; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
[dir="rtl"] .tl .ev { padding: 0 18px 14px 0; }
.tl .ev::before { content: ""; position: absolute; inset-inline-start: -7px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); }
.tl .ev .d { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tl .ev .n { grid-column: 1; overflow-wrap: anywhere; }
textarea.full { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--sunk); font: inherit; color: var(--ink); min-height: 70px; resize: vertical; }
a.btn { text-decoration: none; display: inline-block; color: var(--ink); }
a.btn.primary { color: var(--on-accent); }
a.btn.wa { background: #1fa855; color: #fff; }
.chips2 { display: flex; flex-wrap: wrap; gap: 6px; }
.chips2 button { border: 1.5px solid var(--line); background: var(--sunk); border-radius: 999px; padding: 6px 12px; font-size: .85rem; cursor: pointer; }
.bubble { border-radius: 14px; padding: 10px 14px; max-width: 92%; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .95rem; }
.bubble.me { background: var(--accent-soft); justify-self: end; }
.bubble.ai { background: var(--sunk); justify-self: start; }
.chat { display: grid; gap: 8px; }
.askrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.askrow input { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--sunk); font-size: 1rem; color: var(--ink); }
.stars { display: flex; gap: 6px; }
.stars button { border: 0; background: none; font-size: 1.8rem; line-height: 1; cursor: pointer; color: var(--line); padding: 0 2px; }
.stars button.on { color: var(--warn); }
.lock { min-height: 60vh; display: grid; place-items: center; }
.lock .card { width: min(100%, 360px); text-align: center; justify-items: center; }
.lock input { text-align: center; font-size: 1.6rem; letter-spacing: .4em; width: 100%; padding: 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--sunk); color: var(--ink); }
#qr { background: #fff; padding: 14px; border-radius: 12px; justify-self: center; line-height: 0; }
#qr img, #qr canvas { width: min(70vw, 260px) !important; height: auto !important; image-rendering: pixelated; }
.creator { display: flex; gap: 12px; align-items: center; }
.creator b { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-family: var(--display); flex: none; }
/* risk result (from v1) */
.verdict { display: grid; gap: 14px; }
.bigr { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.bigr .n { font-family: var(--display); font-weight: 800; font-size: clamp(3.2rem, 15vw, 4.4rem); line-height: .9; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.bigr .n small { font-size: .32em; font-weight: 600; letter-spacing: 0; color: var(--muted); margin-inline-start: 6px; }
.waffle { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; width: min(100%, 220px); }
.waffle i { aspect-ratio: 1; border-radius: 50%; background: var(--dot); }
.waffle i.on { background: var(--accent); }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
.facts span { font-size: .85rem; background: var(--sunk); border-radius: 8px; padding: 4px 10px; font-variant-numeric: tabular-nums; }
.drv { display: grid; gap: 8px; }
.drv .r { display: grid; grid-template-columns: minmax(0, 9.5rem) 1fr; gap: 10px; align-items: center; font-size: .88rem; }
.drv .lab { overflow-wrap: anywhere; unicode-bidi: plaintext; }
.drv .tr { position: relative; height: 14px; }
.drv .tr::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line); }
.drv .b { position: absolute; top: 0; height: 14px; border-radius: 4px; }
.drv .b.up { background: var(--bad); left: 50%; }
.drv .b.dn { background: var(--good); right: 50%; }
.legend2 { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); }
.wi { width: 100%; border-collapse: collapse; font-size: .92rem; font-variant-numeric: tabular-nums; }
.wi td { padding: 9px 0; border-bottom: 1px solid var(--line); }
.wi td + td { text-align: end; white-space: nowrap; padding-inline-start: 10px; }
.wi tr:last-child td { border-bottom: 0; font-weight: 700; }
.wi .d { color: var(--good); font-weight: 700; }
.steps { margin: 0; padding-inline-start: 1.2rem; display: grid; gap: 8px; }

.toast { position: fixed; z-index: 8; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 14px; display: flex; gap: 14px; align-items: center; font-size: .92rem; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.18); }
.toast button { background: none; border: 0; color: var(--accent); font-weight: 700; cursor: pointer; }

<script>// ---- Model maths (runs fully on the device) ----
function rawScore(M, x) {
  const z = x.map((v, i) => (v - M.mean1[i]) / M.scale1[i]);
  let logit = M.intercept;
  for (let k = 0; k < M.powers.length; k++) {
    const pw = M.powers[k];
    let t = 1;
    for (let j = 0; j < pw.length; j++) if (pw[j]) t *= pw[j] === 1 ? z[j] : Math.pow(z[j], pw[j]);
    logit += M.coef[k] * (t - M.mean2[k]) / M.scale2[k];
  }
  return 1 / (1 + Math.exp(-logit));
}
// values: object keyed by feature name; null for HighBP / HighChol means "not sure"
function scorePerson(M, values) {
  const F = M.features;
  const unknown = ["HighBP", "HighChol"].filter(f => values[f] === null || values[f] === undefined);
  let combos = [{ w: 1, v: Object.assign({}, values) }];
  for (const f of unknown) {
    const prev = M.mean1[F.indexOf(f)];
    combos = combos.flatMap(c => [
      { w: c.w * prev, v: Object.assign({}, c.v, { [f]: 1 }) },
      { w: c.w * (1 - prev), v: Object.assign({}, c.v, { [f]: 0 }) }]);
  }
  let s = 0;
  for (const c of combos) s += c.w * rawScore(M, F.map(f => c.v[f]));
  s = Math.min(Math.max(s, 1e-6), 1 - 1e-6);
  // balanced class weights behave like a 50/50 prior: shift odds back to the real prevalence
  const odds = s / (1 - s) * M.base_rate / (1 - M.base_rate);
  const prob = odds / (1 + odds);
  let lo = 0, hi = M.quantiles.length - 1;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (M.quantiles[mid] < s) lo = mid + 1; else hi = mid; }
  const pct = Math.round(lo / (M.quantiles.length - 1) * 100);
  return { score: s, prob, pct };
}
// linear-model contributions (log-odds, relative to an average respondent)
function contributions(M, values) {
  return M.features.map((f, i) => {
    let v = values[f];
    if (v === null || v === undefined) v = M.ex_mean[i];
    return { f, c: M.ex_coef[i] * (v - M.ex_mean[i]) / M.ex_scale[i] };
  });
}

function qrText() {
  const p = P(), d = D(), m = med(), a7 = bpAvg(7), a30 = bpAvg(30), last = d.bp[d.bp.length - 1], lc = d.checks[d.checks.length - 1], A = d.answers, w = latestWeight(d);
  const yn = v => (v === null ? "unsure" : v ? "yes" : "no");
  const L = ["HEART RISK CHECK - PATIENT SUMMARY", `${p.name || "-"} | ${p.sex ? "M" : "F"} | born ${p.by}`, `Blood group: ${m.blood || "-"} | Allergies: ${m.allergies || "none recorded"}`];
  if (m.conditions) L.push(`Conditions: ${m.conditions}`);
  L.push(`Meds: ${d.meds.length ? d.meds.map(x => `${x.name} ${x.dose} (${x.slots.map(i => ["am", "noon", "pm", "night"][i]).join("/")})`).join("; ") : "none recorded"}`);
  if (last) L.push(`Last BP: ${last.sys}/${last.dia}${last.pulse ? " P" + last.pulse : ""} on ${dkey(last.t)}`);
  if (a7) L.push(`BP 7-day avg: ${a7.sys}/${a7.dia} (n=${a7.n})`);
  if (a30) L.push(`BP 30-day avg: ${a30.sys}/${a30.dia} (n=${a30.n}), ${a30.inT}% <130/80`);
  if (w) L.push(`Weight ${w} kg, BMI ${bmiOf(p.heightCm, w)}`);
  L.push(`HTN dx: ${yn(A.HighBP)} | High chol: ${yn(A.HighChol)} | Diabetes: ${["no", "pre", "yes"][A.Diabetes]} | Smoker: ${yn(A.Smoker)} | Stroke: ${yn(A.Stroke)}`);
  if (lc) L.push(`Risk screen: ${per100(lc.prob)}/100 (${lc.band}) on ${dkey(lc.t)}`);
  const ev = (m.events || []).slice().sort((a, b) => (a.date < b.date ? -1 : 1)).map(e => `${e.date.slice(0, 4)} ${["Dx", "Op", "Adm", "Vacc", "Test", "Other"][e.kind] || ""}: ${e.note}`);
  if (ev.length) L.push("History: " + ev.join("; "));
  if (m.fam) L.push(`Family hx: ${m.fam}`);
  if (m.contactName || m.contactPhone) L.push(`Emergency contact: ${m.contactName} ${m.contactPhone}`);
  L.push(`Generated ${dkey(Date.now())}. Self-reported; not a diagnosis.`);
  let txt = L.join("\n");
  return txt.length > 1100 ? txt.slice(0, 1097) + "..." : txt;
}

  if (/^rq_/.test(el.id)) { const r = S.req = S.req || {}; r[el.id.slice(3)] = el.id === "rq_u" ? (parseInt(el.value, 10) || 1) : el.value.trim(); save(); shareTexts.req = reqMessage();
    document.getElementById("rqOut").textContent = shareTexts.req; const a = document.getElementById("req_wa"); if (a) a.href = waURL(shareTexts.req); return; }
  if (el.type === "range" && el.dataset.key) { W().answers[el.dataset.key] = Number(el.value); document.getElementById("o_" + el.dataset.key).textContent = `${el.value} ${T1().days}`; save(); }
  if (["w_cm", "w_ft", "w_in", "w_w"].includes(el.id)) { readStep0(); const o = document.getElementById("bmiOut"); if (o) { const w = W(); o.textContent = bmiOf(w.heightCm, w.kg).toFixed(1); } }
});
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form]"); if (!f) return; e.preventDefault();
  const d = S ? D() : null, p = S ? P() : null, num = id => parseFloat((document.getElementById(id) || {}).value);
  switch (f.dataset.form) {
    case "bp": {
      const sys = Math.round(num("f_sys")), dia = Math.round(num("f_dia")), pulse = Math.round(num("f_pulse"));
      if (!(sys >= 60 && sys <= 260 && dia >= 30 && dia <= 160 && dia < sys)) { document.getElementById(!(sys >= 60 && sys <= 260) ? "f_sys" : "f_dia").focus(); return; }
      const note = ((document.getElementById("f_note") || {}).value || "").trim();
      d.bp.push({ t: Date.now(), sys, dia, pulse: pulse >= 30 && pulse <= 220 ? pulse : null, src: ui.photoUsed ? "photo" : "manual", note: note || undefined, created: Date.now() }); d.bp.sort((a, b) => a.t - b.t); ui.photoUsed = false;
      save(); ui.form = null; ui.flash = { sys, dia, cat: bpCat(sys, dia) }; render(); window.scrollTo({ top: 0 }); break;
    }
    case "med": {
      const name = (document.getElementById("f_mname").value || "").trim(); if (!name) { document.getElementById("f_mname").focus(); return; }
      const slots = [0, 1, 2, 3].filter(i => document.getElementById("f_slot" + i).checked);
      d.meds.push({ id: uid(), name, dose: (document.getElementById("f_mdose").value || "").trim(), slots: slots.length ? slots : [0], since: startOfDay(Date.now()) });
      save(); ui.form = null; render(); break;
    }
    case "profile": {
      p.name = (document.getElementById("p_name").value || "").trim();
      const by = num("p_by"); if (by >= 1900 && by <= new Date().getFullYear() - 18) p.by = Math.round(by);
      if (isImp()) { const ft = num("p_ft"), inch = num("p_in") || 0; if (ft > 2 && ft < 8) p.heightCm = Math.round((ft * 12 + inch) * 2.54); }
      else { const cm = num("p_cm"); if (cm > 90 && cm < 250) p.heightCm = cm; }
      if (p.demo) delete p.demo;
      save(); render(); toast(t("save") + " ✓"); break;
    }
    case "weight": { const w = num("f_w"); if (!(w > 0)) return; const kg = toKg(w); if (kg < 20 || kg > 350) return; d.weight.push({ t: Date.now(), kg: Math.round(kg * 10) / 10 }); save(); render(); break; }
    case "imppin": { const pin = document.getElementById("impPin").value;
      openSealed(ui.impPending, pin).then(r => { const v = r.data; if (!v.profiles || !v.data) throw 0; S = v; ui.impPending = null; save(); go("today"); toast(t("imported")); })
        .catch(() => { const m = document.getElementById("impMsg"); if (m) { m.textContent = t("wrongPin"); m.hidden = false; } }); break; }
    case "ob": { if (!document.getElementById("obOk").checked) return; S.consents = (S.consents || []).concat([{ purpose: "terms", v: POLICY_V, at: Date.now() }]); save(); render(); window.scrollTo(0, 0); break; }
    case "unlock": { const pin = document.getElementById("lockPin").value; const btn = f.querySelector("button[type=submit]"); btn.disabled = true;
      unlockWith(pin).then(() => { ui.forgot = false; ui.eraseArm = false; render(); }).catch(e => { btn.disabled = false; const er = document.getElementById("lockErr"); if (er) { er.textContent = e && e.wait ? fmt(t("tooMany"), { s: e.wait }) : t("wrongPin"); er.hidden = false; } const pi = document.getElementById("lockPin"); pi.value = ""; pi.focus(); }); break; }
    case "setlock": { const a = document.getElementById("pinA").value, b2 = document.getElementById("pinB").value, msg = document.getElementById("pinMsg");
      if (!/^\d{6,12}$/.test(a)) { msg.textContent = t("pinShort"); msg.hidden = false; return; } if (a !== b2) { msg.textContent = t("pinMismatch"); msg.hidden = false; return; }
      enableLock(a).then(() => { rerenderKeep(); toast(t("lockOn")); }).catch(() => { msg.textContent = "Encryption is not available in this browser."; msg.hidden = false; }); break; }
    case "coach": { const inp = document.getElementById("coachIn"); const q = (inp.value || "").trim(); if (q) coachAsk(q); break; }
    case "don": { const dt = document.getElementById("d_date").value; if (!dt) return; const m = med(); m.dons.push({ id: uid(), date: dt, place: document.getElementById("d_place").value.trim() }); save(); ui.form = null; render(); break; }
    case "mid": { const m = med(); m.blood = document.getElementById("m_blood").value; m.allergies = document.getElementById("m_all").value.trim(); m.conditions = document.getElementById("m_cond").value.trim();
      m.contactName = document.getElementById("m_cn").value.trim(); m.contactPhone = document.getElementById("m_cp").value.trim(); if (S.req && !S.req.h && m.blood) S.req.g = m.blood; save(); ui.form = null; render(); break; }
    case "ev": { const dt = document.getElementById("e_date").value, note = document.getElementById("e_note").value.trim(); if (!dt) { document.getElementById("e_date").focus(); return; } if (!note) { document.getElementById("e_note").focus(); return; }
      const m = med(); m.events = m.events || []; m.events.push({ id: uid(), date: dt, kind: Number(document.getElementById("e_kind").value), note }); save(); ui.form = null; render(); break; }
    case "person": { const name = (document.getElementById("f_pname").value || "").trim(); if (!name) return; const np = newProfile(name); S.profiles.push(np); S.data[np.id] = blankData(); S.active = np.id; save(); go("me"); break; }
  }
});

// ---------- boot ----------
let deferredInstall = null;
(async () => { try { if (window.claude && window.claude.use) { const s = await window.claude.use("sample"); if (s) { AI.sample = s; try { const l = await s.limits(); AI.images = !!(l && l.images); } catch (e) {} if (["today", "bp"].includes(ui.tab)) rerenderKeep(); } } } catch (e) {} })();
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; if (ui.tab === "me") render(); });
try { if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}
if (hasLock()) { S = null; LOCKED = true; } else if (!S) { S = makeDemo(); save(); }
const sel = document.getElementById("lang");
sel.innerHTML = Object.keys(I18N).map(k => `<option value="${k}" ${k === lang ? "selected" : ""}>${I18N[k]._name}</option>`).join("");
const h = (location.hash || "").slice(1); if (TABS.includes(h)) ui.tab = h;
render();
</script>
